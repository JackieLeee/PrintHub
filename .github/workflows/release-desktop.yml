name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac
            runner: macos-latest
            dist: pnpm build:web:desktop && pnpm --filter @virt-printer/bridge build && pnpm --filter @virt-printer/desktop dist:ci
            artifact: mac-desktop
            glob: apps/desktop/release/*.dmg
          - id: win
            runner: windows-latest
            dist: pnpm dist:desktop:win
            artifact: win-desktop
            glob: apps/desktop/release/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches desktop version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match apps/desktop/package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build desktop installer
        run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release notes
        id: notes
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "path=.github/release-notes/TEMPLATE.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/**
          replace_assets: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
