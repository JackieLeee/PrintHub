name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches desktop version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match apps/desktop/package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build macOS arm64 + universal DMG
        run: pnpm build:web:desktop && pnpm --filter @virt-printer/bridge build && pnpm --filter @virt-printer/desktop dist:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/desktop/release/*.dmg
          replace_assets: true
          generate_release_notes: true
