name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac
            runner: macos-latest
            dist: pnpm build:web:desktop && pnpm --filter @virt-printer/bridge build && pnpm --filter @virt-printer/desktop dist:ci
            artifact: mac-desktop
            glob: apps/desktop/release/*.dmg
          - id: win
            runner: windows-latest
            dist: pnpm dist:desktop:win
            artifact: win-desktop
            glob: apps/desktop/release/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches desktop version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match apps/desktop/package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build desktop installer
        run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then NOTES=".github/release-notes/TEMPLATE.md"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          fi

          shopt -s globstar nullglob
          assets=(release-assets/**)
          if [ ${#assets[@]} -gt 0 ]; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          fi
