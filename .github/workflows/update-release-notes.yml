name: Update Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing ${NOTES} — create it before updating."
            exit 1
          fi
          gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" --draft=false
